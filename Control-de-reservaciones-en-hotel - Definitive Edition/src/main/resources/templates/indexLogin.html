<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Triple Deluxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-cover bg-center from-slate-50 to-slate-200"
      style="background-image: url('https://www.infobae.com/new-resizer/xBbI9tmdUpBYPN4T7yKzUpwYonQ=/arc-anglerfish-arc2-prod-infobae/public/TBF3OLDXRVFA5CBDDVOJ3HCUYI.jpg');">

<div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-center text-slate-800 mb-6">Inicio de Sesión</h1>

    <!--Aquí se cambia para enviar al backend -->
    <form th:action="@{/login}" method="post" class="space-y-4">
        <!-- Usuario -->
        <div>
            <label for="usuario" class="block text-sm font-medium text-slate-700 mb-1">Nombre de Usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Usuario" required
                   class="w-full px-4 py-2 border rounded-lg border-slate-300 focus:ring-2 focus:ring-slate-500 focus:outline-none">
        </div>

        <!-- Contraseña -->
        <div>
            <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Escribe tu contraseña" required
                   class="w-full px-4 py-2 border rounded-lg border-slate-300 focus:ring-2 focus:ring-slate-500 focus:outline-none">
            <button type="button" class="mt-2 text-sm px-3 py-1 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200"
                    onclick="togglePassword()">Mostrar</button>
        </div>

        <!-- Botón ingresar -->
        <button type="submit"
                class="w-full bg-green-800 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition">
            Ingresar
        </button>

        <!-- Error del backend (si existe) -->
        <p th:if="${error}" th:text="${error}" class="text-red-600 text-center mt-2"></p>

    </form>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById("password");
        const toggleButton = document.querySelector(".mt-2");
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleButton.textContent = "Ocultar";
        } else {
            passwordInput.type = "password";
            toggleButton.textContent = "Mostrar";
        }
    }
</script>
</body>
</html>
