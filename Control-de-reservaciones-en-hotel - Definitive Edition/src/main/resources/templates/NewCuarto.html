<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Cuartos</title>
    <style>
        body { font-family: "Segoe UI", sans-serif; background-color: #f0f4f8; padding: 20px; }
        h1 { text-align: center; color: #003366; margin-bottom: 20px; }

        .container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }

        /* Formulario */
        .form-container { background-color: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 350px; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #003366; }
        input { width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: 1px solid #aaccee; }

        /* Lista */
        .list-container { background-color: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); flex-grow: 1; min-width: 400px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #aaccee; padding: 8px; text-align: left; }
        th { background-color: #0077b6; color: #fff; }
        .actions a { margin-right: 10px; text-decoration: none; padding: 5px 10px; border-radius: 5px; color: #fff; }
        .actions .delete { background-color: #dc3545; }
        .actions .delete:hover { background-color: #b02a37; }
        .actions .edit { background-color: #ffc107; color: #000; }
        .actions .edit:hover { background-color: #e0a800; }

        /* Botones del formulario */
        .button-group { display: flex; gap: 10px; margin-top: 15px; justify-content: flex-end; }
        .button-group button, .button-group a {
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s;
        }
        .button-group button { background-color: #0077b6; color: #fff; }
        .button-group button:hover { background-color: #005f8a; }
        .button-group a { background-color: #cccccc; color: #333; display: inline-flex; align-items: center; justify-content: center; }
        .button-group a:hover { background-color: #b3b3b3; }

        @media (max-width: 900px) {
            .container { flex-direction: column; align-items: center; }
            .list-container { min-width: 100%; }
        }
    </style>
</head>
<body>

<h1>Gestión de Cuartos</h1>

<div class="container">
    <!-- Formulario para nuevo/editar cuarto -->
    <div class="form-container">
        <form th:action="@{${cuarto.idCuarto} != null ? '/cuartos/editar/' + ${cuarto.idCuarto} : '/cuartos/guardar'}"
              th:object="${cuarto}" method="post">

            <label for="tipo">Tipo de habitación:</label>
            <input type="text" id="tipo" th:field="*{tipo}" placeholder="Ej: Suite, Doble, Individual" required>

            <label for="precio">Precio:</label>
            <input type="number" id="precio" th:field="*{precio}" step="0.01" placeholder="Ej: 100.00" required>

            <div class="button-group">
                <button type="submit" th:text="${cuarto.idCuarto} != null ? 'Actualizar' : 'Guardar'"></button>

<!--                Si el objeto cuarto tiene un idCuarto (osea ya existe en la base de datos), significa que estamos editando un cuarto.-->
<!--                Si es null, significa que estamos creando uno nuevo.-->
<!--                'Actualizar': texto del botón si estamos editando.-->
<!--                'Guardar': texto del botón si estamos creando uno nuevo.-->
                <a href="/reservaciones">Cancelar</a>
            </div>
        </form>
    </div>

    <!-- Lista de cuartos existentes -->
    <div class="list-container">
        <h2>Cuartos Existentes</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Tipo</th>
                <th>Precio ($)</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${cuartos}">
                <td th:text="${c.idCuarto}"></td>
                <td th:text="${c.tipo}"></td>
                <td th:text="${c.precio}"></td>
                <td class="actions">
                    <a th:href="@{/cuartos/editar/{id}(id=${c.idCuarto})}" class="edit">Editar</a>
                    <a th:href="@{/cuartos/eliminar/{id}(id=${c.idCuarto})}" class="delete"
                       onclick="return confirm('¿Seguro que deseas eliminar este cuarto?');">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
